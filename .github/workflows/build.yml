# Builds the Android APK and an unsigned iOS IPA on every push to main,
# or on demand (Actions tab -> Build apps -> Run workflow).
# Download them from the run's "Artifacts" section.
# Pushing a tag like v1.0.0 also attaches both files to a GitHub Release.
name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed only to create the Release on tags

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk temple-alarm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: temple-alarm-apk
          path: temple-alarm.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: temple-alarm.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # An IPA is a zip with Runner.app inside a Payload folder.
      # It is unsigned: it must be signed (e.g. AltStore, Sideloadly, or an
      # Apple Developer account) before it installs on an iPhone.
      - run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr temple-alarm-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: temple-alarm-ipa
          path: temple-alarm-unsigned.ipa
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: temple-alarm-unsigned.ipa
